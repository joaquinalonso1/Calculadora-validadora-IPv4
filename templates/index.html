<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora CIDR</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #ffffff; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background-color: #2d2d2d; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        input[type="text"] { width: 85%; padding: 12px; margin: 15px 0; border-radius: 5px; border: 1px solid #444; background-color: #333; color: white; }
        button { background-color: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 90%; }
        button:hover { background-color: #0056b3; }
        .error { color: #ff4d4d; margin-top: 15px; font-weight: bold; }
        .success { color: #4CAF50; margin-top: 15px; font-weight: bold; }
        .resultados { text-align: left; margin-top: 25px; background-color: #3d3d3d; padding: 20px; border-radius: 5px; front-size: 20px; line-height: 1.6; }
        p { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Calculadora CIDR</h2>
        <form method="POST">
            <input type="text" name="ip_input" placeholder="Ej: 192.168.1.50/24" value="{{ entrada_previa }}" required>
            <br>
            <button type="submit">Calcular Subred</button>
        </form>

        {% if error %}
            <p class="error">❌ {{ error }}</p>
        {% endif %}

        {% if resultados %}
            <p class="success">✅ Cálculo exitoso</p>
            <div class="resultados">
                <p><strong>Red:</strong> {{ resultados.red }}</p>
                <p><strong>Máscara:</strong> {{ resultados.mascara }}</p>
                <p><strong>Rango de IPs:</strong> {{ resultados.rango }}</p>
                <p><strong>Broadcast:</strong> {{ resultados.broadcast }}</p>
                <p><strong>Hosts utilizables:</strong> {{ resultados.hosts }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
